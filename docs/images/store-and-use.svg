<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#10b981"/>
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="960" height="560" rx="16" fill="#f8fafc"/>

  <text x="480" y="44" text-anchor="middle" font-size="24" font-weight="700" fill="#0f172a">Create the store once. Use it in any file.</text>

  <!-- ① Store file -->
  <g filter="url(#shadow)">
    <rect x="30" y="80" width="430" height="270" rx="12" fill="#0f172a"/>
    <path d="M30 92 a12 12 0 0 1 12 -12 h406 a12 12 0 0 1 12 12 v24 h-430 z" fill="#1e293b"/>
  </g>
  <circle cx="52" cy="98" r="6" fill="#ef4444"/><circle cx="72" cy="98" r="6" fill="#f59e0b"/><circle cx="92" cy="98" r="6" fill="#22c55e"/>
  <text x="245" y="103" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0">userStore.js</text>
  <g xml:space="preserve" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13.5">
    <text x="50" y="150"><tspan fill="#c792ea">import</tspan><tspan fill="#e2e8f0"> { createStore } </tspan><tspan fill="#c792ea">from</tspan><tspan fill="#c3e88d"> 'uni-state-storage'</tspan><tspan fill="#e2e8f0">;</tspan></text>
    <text x="50" y="190"><tspan fill="#c792ea">export const</tspan><tspan fill="#e2e8f0"> userStore = </tspan><tspan fill="#82aaff">createStore</tspan><tspan fill="#e2e8f0">(</tspan><tspan fill="#c3e88d">'user'</tspan><tspan fill="#e2e8f0">, {</tspan></text>
    <text x="50" y="214" fill="#e2e8f0">  name: <tspan fill="#c3e88d">''</tspan>,</text>
    <text x="50" y="238" fill="#e2e8f0">  age: <tspan fill="#f78c6c">0</tspan>,</text>
    <text x="50" y="262" fill="#e2e8f0">  loggedIn: <tspan fill="#f78c6c">false</tspan>,</text>
    <text x="50" y="286" fill="#e2e8f0">});</text>
  </g>
  <rect x="30" y="366" width="430" height="44" rx="22" fill="#6366f1"/>
  <text x="245" y="394" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">① Create the store (one time)</text>

  <!-- ② Using files -->
  <g filter="url(#shadow)">
    <rect x="530" y="80" width="400" height="150" rx="12" fill="#0f172a"/>
    <path d="M530 92 a12 12 0 0 1 12 -12 h376 a12 12 0 0 1 12 12 v24 h-400 z" fill="#1e293b"/>
  </g>
  <circle cx="552" cy="98" r="6" fill="#ef4444"/><circle cx="572" cy="98" r="6" fill="#f59e0b"/><circle cx="592" cy="98" r="6" fill="#22c55e"/>
  <text x="730" y="103" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0">app.js</text>
  <g xml:space="preserve" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13.5">
    <text x="548" y="148"><tspan fill="#c792ea">import</tspan><tspan fill="#e2e8f0"> { userStore } </tspan><tspan fill="#c792ea">from</tspan><tspan fill="#c3e88d"> './userStore.js'</tspan><tspan fill="#e2e8f0">;</tspan></text>
    <text x="548" y="182" fill="#e2e8f0">userStore.<tspan fill="#82aaff">setItem</tspan>(<tspan fill="#c3e88d">'name'</tspan>, <tspan fill="#c3e88d">'Vasanth'</tspan>);</text>
    <text x="548" y="206" fill="#e2e8f0">userStore.<tspan fill="#82aaff">getItem</tspan>(<tspan fill="#c3e88d">'name'</tspan>); <tspan fill="#64748b">// 'Vasanth'</tspan></text>
  </g>

  <g filter="url(#shadow)">
    <rect x="530" y="250" width="400" height="160" rx="12" fill="#0f172a"/>
    <path d="M530 262 a12 12 0 0 1 12 -12 h376 a12 12 0 0 1 12 12 v24 h-400 z" fill="#1e293b"/>
  </g>
  <circle cx="552" cy="268" r="6" fill="#ef4444"/><circle cx="572" cy="268" r="6" fill="#f59e0b"/><circle cx="592" cy="268" r="6" fill="#22c55e"/>
  <text x="730" y="273" text-anchor="middle" font-size="14" font-weight="600" fill="#e2e8f0">header.js</text>
  <g xml:space="preserve" font-family="'SFMono-Regular', Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="13.5">
    <text x="548" y="318"><tspan fill="#c792ea">import</tspan><tspan fill="#e2e8f0"> { userStore } </tspan><tspan fill="#c792ea">from</tspan><tspan fill="#c3e88d"> './userStore.js'</tspan><tspan fill="#e2e8f0">;</tspan></text>
    <text x="548" y="350" fill="#e2e8f0">userStore.<tspan fill="#82aaff">subscribe</tspan>((state) =&gt; {</text>
    <text x="548" y="374" fill="#e2e8f0">  console.<tspan fill="#82aaff">log</tspan>(<tspan fill="#c3e88d">'Hello'</tspan>, state.name);</text>
    <text x="548" y="398" fill="#e2e8f0">});</text>
  </g>
  <rect x="530" y="426" width="400" height="44" rx="22" fill="#10b981"/>
  <text x="730" y="454" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff">② Import it &amp; use it anywhere</text>

  <!-- arrows -->
  <path d="M462 200 C 495 200, 495 155, 526 155" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M462 230 C 495 230, 495 330, 526 330" fill="none" stroke="#10b981" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="469" y="219" width="52" height="22" rx="11" fill="#ecfdf5" stroke="#10b981"/><text x="495" y="234" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">import</text>

  <!-- shared state -->
  <rect x="30" y="490" width="900" height="50" rx="12" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="480" y="521" text-anchor="middle" font-size="15" fill="#3730a3"><tspan font-weight="700">One shared state:</tspan> when app.js calls setItem(), header.js is notified instantly.</text>
</svg>
